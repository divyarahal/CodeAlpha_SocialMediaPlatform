{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Home{% endblock %} · Connectly</title>
  <link rel="stylesheet" href="{% static 'network/style.css' %}">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="{% url 'home' %}">Connectly</a>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'people' %}">People</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' user.username %}">@{{ user.username }}</a>
        <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Log out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a class="btn small" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="container">
  {% for m in messages %}<div class="flash {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{% static 'network/app.js' %}"></script>
</body>
</html>
