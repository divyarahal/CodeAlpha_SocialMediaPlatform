{% if page_obj.paginator.num_pages > 1 %}
<div class="pager">
  {% if page_obj.has_previous %}<a class="btn small ghost" href="?{% if feed %}feed={{ feed }}&{% endif %}page={{ page_obj.previous_page_number }}">← Newer</a>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn small ghost" href="?{% if feed %}feed={{ feed }}&{% endif %}page={{ page_obj.next_page_number }}">Older →</a>{% endif %}
</div>
{% endif %}
