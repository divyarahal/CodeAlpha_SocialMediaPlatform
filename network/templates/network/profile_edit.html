{% extends 'network/base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<form method="post" class="card form">{% csrf_token %}
  <label>Bio</label>{{ form.bio }}{{ form.bio.errors }}
  <label>Location</label>{{ form.location }}{{ form.location.errors }}
  <button class="btn">Save</button>
</form>
{% endblock %}
